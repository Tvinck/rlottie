<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAZZAR — ИИ Инструменты</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .main { overflow: hidden; }

    /* ── AI layout ── */
    .ai-wrap { display:flex; height:calc(100vh - 61px); overflow:hidden; }

    /* ── AI sidebar ── */
    .ai-sidebar {
      width:240px; flex-shrink:0; background:var(--bg-secondary);
      border-right:1px solid var(--border); overflow-y:auto; padding:10px 0;
    }
    .ai-cat { margin-bottom:2px; }
    .ai-cat-head {
      display:flex; align-items:center; gap:8px; padding:8px 14px;
      font-size:11px; font-weight:700; color:var(--text-muted);
      text-transform:uppercase; letter-spacing:.07em; cursor:pointer;
      user-select:none; transition:color .12s;
    }
    .ai-cat-head:hover { color:var(--text-sub); }
    .ai-cat-head .cat-icon { font-size:14px; }
    .ai-cat-head .cat-arrow { margin-left:auto; transition:transform .2s; }
    .ai-cat.open .cat-arrow { transform:rotate(90deg); }
    .ai-cat-items { display:none; }
    .ai-cat.open .ai-cat-items { display:block; }
    .ai-item {
      display:flex; align-items:center; gap:8px;
      padding:7px 14px 7px 36px; font-size:13px; color:var(--text-sub);
      cursor:pointer; transition:all .12s; border-radius:0;
    }
    .ai-item:hover { background:rgba(255,255,255,.04); color:var(--text-primary); }
    .ai-item.active { background:rgba(170,255,71,.1); color:var(--accent); font-weight:500; }
    .ai-item::before { content:''; width:4px; height:4px; border-radius:50%; background:currentColor; opacity:.4; flex-shrink:0; }
    .ai-item.active::before { opacity:1; }

    /* ── AI main ── */
    .ai-main { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }

    /* ── Tool header ── */
    .tool-topbar {
      padding:14px 20px; border-bottom:1px solid var(--border);
      background:var(--bg-primary); flex-shrink:0;
      display:flex; align-items:center; gap:12px;
    }
    .tool-icon-big { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; background:var(--accent-dim); flex-shrink:0; }
    .tool-title { font-size:15px; font-weight:700; }
    .tool-subtitle { font-size:11px; color:var(--text-muted); margin-top:1px; }

    /* ── Generic tool body ── */
    .tool-body { flex:1; overflow-y:auto; padding:24px; }
    .tool-section { margin-bottom:20px; }
    .tool-label { font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; }
    .tool-textarea {
      width:100%; background:var(--bg-card2); border:1px solid var(--border);
      border-radius:var(--radius-sm); padding:12px 14px; color:var(--text-primary);
      font-size:13px; font-family:inherit; resize:vertical; outline:none;
      min-height:100px; line-height:1.5; box-sizing:border-box; transition:border-color .15s;
    }
    .tool-textarea:focus { border-color:var(--accent); }
    .tool-upload {
      width:100%; border:2px dashed var(--border); border-radius:var(--radius-sm);
      padding:32px 20px; text-align:center; cursor:pointer; transition:all .15s;
      background:var(--bg-card2);
    }
    .tool-upload:hover { border-color:var(--accent); background:var(--accent-dim); }
    .tool-upload-icon { font-size:28px; margin-bottom:8px; }
    .tool-upload-label { font-size:13px; color:var(--text-muted); }
    .tool-output {
      background:var(--bg-card2); border:1px solid var(--border); border-radius:var(--radius-sm);
      padding:16px; min-height:80px; color:var(--text-muted); font-size:13px;
      display:flex; align-items:center; justify-content:center; text-align:center;
    }
    .tool-output.has-content { align-items:flex-start; justify-content:flex-start; color:var(--text-primary); }
    .api-badge { display:inline-flex;align-items:center;gap:5px;background:rgba(170,255,71,.1);border:1px solid rgba(170,255,71,.2);color:var(--accent);font-size:10px;font-weight:600;padding:3px 8px;border-radius:8px;margin-bottom:16px; }

    /* ── CHAT ── */
    .chat-wrap-inner { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .chat-feed {
      flex:1; overflow-y:auto; padding:20px 24px;
      display:flex; flex-direction:column; gap:14px;
    }
    .msg { max-width:72%; }
    .msg.user { align-self:flex-end; }
    .msg.ai   { align-self:flex-start; }
    .msg-bubble {
      padding:11px 16px; border-radius:16px; font-size:13px; line-height:1.6; white-space:pre-wrap; word-break:break-word;
    }
    .msg.user .msg-bubble { background:var(--accent); color:#0B0B14; border-radius:16px 16px 4px 16px; }
    .msg.ai   .msg-bubble { background:var(--bg-card2); border-radius:16px 16px 16px 4px; }
    .msg-meta { font-size:10px; color:var(--text-muted); margin-top:4px; }
    .msg.user .msg-meta { text-align:right; }
    .typing-dot { display:inline-flex;gap:3px;padding:11px 16px;background:var(--bg-card2);border-radius:16px 16px 16px 4px;align-self:flex-start; }
    .typing-dot span { width:7px;height:7px;border-radius:50%;background:var(--text-muted);animation:blink 1.2s infinite; }
    .typing-dot span:nth-child(2){animation-delay:.2s;}
    .typing-dot span:nth-child(3){animation-delay:.4s;}
    @keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
    .chat-input-bar {
      padding:12px 16px; border-top:1px solid var(--border);
      display:flex; gap:8px; align-items:flex-end; flex-shrink:0;
    }
    .chat-input-bar textarea {
      flex:1; background:var(--bg-card2); border:1px solid var(--border);
      border-radius:var(--radius-sm); padding:10px 14px; color:var(--text-primary);
      font-size:13px; font-family:inherit; outline:none; resize:none;
      line-height:1.5; max-height:120px; overflow-y:auto; transition:border-color .15s;
    }
    .chat-input-bar textarea:focus { border-color:var(--accent); }
    .chat-send { width:38px;height:38px;border-radius:var(--radius-sm);background:var(--accent);color:#0B0B14;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s; }
    .chat-send:hover { opacity:.85; }
    .chat-send:disabled { opacity:.4; cursor:default; }
    .chat-empty { flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-muted); }
    .chat-empty-icon { font-size:36px;opacity:.4; }
    .chat-welcome { font-size:20px;font-weight:700;color:var(--text-primary);margin-bottom:4px; }
    .chat-welcome-sub { font-size:13px;color:var(--text-muted);text-align:center;max-width:320px; }
    .chat-starters { display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px; }
    .starter-btn { background:var(--bg-card2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 14px;font-size:12px;color:var(--text-sub);cursor:pointer;font-family:inherit;transition:all .15s; }
    .starter-btn:hover { border-color:var(--accent);color:var(--accent);background:var(--accent-dim); }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar"></aside>

  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="toolTitle">ИИ Инструменты</div>
      <div class="topbar-actions">
        <div class="api-badge">
          <svg width="9" height="9" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="5" fill="#3ECF61"/></svg>
          API подключён
        </div>
        <div class="icon-btn" onclick="openNotifications()" style="position:relative;" title="Уведомления">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notif-bell-badge" style="position:absolute;top:-4px;right:-4px;background:var(--accent);color:#0B0B14;font-size:8px;font-weight:800;border-radius:8px;padding:1px 4px;min-width:14px;text-align:center;line-height:14px;"></span>
        </div>
      </div>
    </div>

    <div class="ai-wrap">

      <!-- ── AI SIDEBAR ── -->
      <div class="ai-sidebar" id="aiSidebar"></div>

      <!-- ── AI MAIN ── -->
      <div class="ai-main" id="aiMain"></div>

    </div>
  </div>
</div>

<script src="nav.js"></script>
<script>
initNav('ai-tools');

// SECURITY: API ключ убран из браузера.
// Все AI-запросы проксируются через /api/ai/* (src/server/routes/ai.ts).
// API_KEY хранится в .env на сервере и никогда не покидает backend.
//
// В dev-режиме этот файл работает как есть (inline JS).
// В production подключается скомпилированный TypeScript: src/client/pages/ai-tools.ts

// ── CATEGORY / TOOL STRUCTURE ──
const CATS = [
  {
    id:'video', label:'Генерация видео', icon:'🎬',
    items:[
      {id:'text-to-video',    label:'Текст в видео',       desc:'Создание видео из текстового описания',              accept:null},
      {id:'image-to-video',   label:'Изображение в видео', desc:'Оживите статичное изображение',                     accept:'image/*'},
      {id:'video-to-video',   label:'Видео в видео',       desc:'Преобразование стиля видео',                        accept:'video/*'},
      {id:'video-editing',    label:'Редактирование видео', desc:'Умное редактирование видео по описанию',            accept:'video/*'},
      {id:'speech-to-video',  label:'Речь в видео',        desc:'Генерация видео на основе речи',                    accept:'audio/*'},
      {id:'lip-sync',         label:'Синхронизация губ',   desc:'Синхронизация движения губ с аудио',                accept:'video/*'},
    ]
  },
  {
    id:'image', label:'Генерация изображений', icon:'🖼️',
    items:[
      {id:'text-to-image',    label:'Текст в изображение',          desc:'Генерация изображения по описанию',         accept:null},
      {id:'image-to-image',   label:'Изображение в изображение',    desc:'Преобразование стиля и содержимого',        accept:'image/*'},
      {id:'image-editing',    label:'Редактирование изображений',   desc:'Умное редактирование по инструкции',        accept:'image/*'},
    ]
  },
  {
    id:'music', label:'Генерация музыки', icon:'🎵',
    items:[
      {id:'text-to-music',    label:'Текст в музыку',  desc:'Создание музыки из текстового описания',               accept:null},
    ]
  },
  {
    id:'speech', label:'Речь', icon:'🔊',
    items:[
      {id:'speech-to-text',   label:'Речь в текст',    desc:'Транскрипция аудио и видеозаписей',                    accept:'audio/*,video/*'},
      {id:'text-to-speech',   label:'Текст в речь',    desc:'Синтез реалистичной речи из текста',                   accept:null},
      {id:'audio-to-audio',   label:'Аудио в аудио',   desc:'Изменение голоса, шумоподавление',                     accept:'audio/*'},
    ]
  },
  {
    id:'chat', label:'Чат', icon:'💬',
    items:[
      {id:'chat',             label:'Чат',             desc:'Диалог с ИИ-ассистентом',                              accept:null},
    ]
  }
];

let activeToolId = 'chat';
let chatHistory = [];
let isLoading = false;

// ── BUILD SIDEBAR ──
function buildSidebar() {
  const sb = document.getElementById('aiSidebar');
  sb.innerHTML = CATS.map(cat => `
    <div class="ai-cat ${cat.id==='chat'?'open':''}" id="cat-${cat.id}">
      <div class="ai-cat-head" onclick="toggleCat('${cat.id}')">
        <span class="cat-icon">${cat.icon}</span>
        <span>${cat.label}</span>
        <svg class="cat-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      <div class="ai-cat-items">
        ${cat.items.map(item => `
          <div class="ai-item ${item.id===activeToolId?'active':''}" id="item-${item.id}" onclick="selectTool('${item.id}','${cat.id}')">
            ${item.label}
          </div>`).join('')}
      </div>
    </div>`).join('');
}

function toggleCat(id) {
  document.getElementById('cat-'+id).classList.toggle('open');
}

function selectTool(toolId, catId) {
  activeToolId = toolId;
  document.querySelectorAll('.ai-item').forEach(el=>el.classList.remove('active'));
  document.getElementById('item-'+toolId)?.classList.add('active');
  // Open parent category
  document.getElementById('cat-'+catId)?.classList.add('open');

  const cat = CATS.find(c=>c.id===catId);
  const tool = cat?.items.find(t=>t.id===toolId);
  if (!tool) return;

  document.getElementById('toolTitle').textContent = tool.label;

  if (toolId === 'chat') {
    renderChat();
  } else {
    renderTool(tool, cat);
  }
}

// ── GENERIC TOOL UI ──
function renderTool(tool, cat) {
  const needsUpload = tool.accept !== null;
  const needsText   = tool.accept === null || tool.id.includes('editing') || tool.id.includes('to-video') || tool.id.includes('to-image');

  document.getElementById('aiMain').innerHTML = `
    <div class="tool-topbar">
      <div class="tool-icon-big">${cat.icon}</div>
      <div>
        <div class="tool-title">${tool.label}</div>
        <div class="tool-subtitle">${tool.desc}</div>
      </div>
      <div class="api-badge" style="margin-left:auto;">
        <svg width="9" height="9" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="5" fill="#3ECF61"/></svg>
        API активен
      </div>
    </div>
    <div class="tool-body">
      ${needsText ? `
      <div class="tool-section">
        <div class="tool-label">Описание / промпт</div>
        <textarea class="tool-textarea" id="toolPrompt" placeholder="Опишите что хотите получить...">${getDefaultPrompt(tool.id)}</textarea>
      </div>` : ''}

      ${needsUpload ? `
      <div class="tool-section">
        <div class="tool-label">Загрузить файл</div>
        <label class="tool-upload" for="fileInput">
          <div class="tool-upload-icon">${uploadIcon(tool.accept)}</div>
          <div class="tool-upload-label" id="uploadLabel">Нажмите или перетащите файл<br><span style="font-size:11px;color:var(--text-muted);margin-top:4px;display:block;">${acceptLabel(tool.accept)}</span></div>
          <input type="file" id="fileInput" accept="${tool.accept}" style="display:none;" onchange="handleFile(this)"/>
        </label>
      </div>` : ''}

      <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;">
        ${renderToolOptions(tool.id)}
      </div>

      <button class="btn btn-primary" id="genBtn" onclick="runGenerate('${tool.id}')" style="margin-bottom:20px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Сгенерировать
      </button>

      <div class="tool-section">
        <div class="tool-label">Результат</div>
        <div class="tool-output" id="toolOutput">
          <div style="display:flex;flex-direction:column;align-items:center;gap:8px;opacity:.5;">
            <div style="font-size:28px;">${cat.icon}</div>
            <div style="font-size:12px;">Здесь появится результат</div>
          </div>
        </div>
      </div>
    </div>`;
}

function getDefaultPrompt(id) {
  const defaults = {
    'text-to-video':  'Закат над океаном, волны бьются о берег, золотой час',
    'text-to-image':  'Профессиональный портрет, студийное освещение, 4K',
    'text-to-music':  'Спокойная фоновая музыка для работы, без слов, 60 BPM',
    'text-to-speech': 'Введите текст для синтеза речи...',
    'image-editing':  'Убери фон, сделай яркее, добавь тень',
    'video-editing':  'Ускорь в 2 раза, добавь субтитры, сделай cinematic',
  };
  return defaults[id] || '';
}

function uploadIcon(accept) {
  if (!accept) return '📄';
  if (accept.includes('image')) return '🖼️';
  if (accept.includes('video')) return '🎥';
  if (accept.includes('audio')) return '🎧';
  return '📎';
}

function acceptLabel(accept) {
  if (!accept) return '';
  if (accept.includes('image')) return 'JPG, PNG, WEBP до 10 МБ';
  if (accept.includes('video') && accept.includes('audio')) return 'MP4, MOV, MP3, WAV до 50 МБ';
  if (accept.includes('video')) return 'MP4, MOV, AVI до 50 МБ';
  if (accept.includes('audio')) return 'MP3, WAV, OGG до 20 МБ';
  return '';
}

function renderToolOptions(id) {
  const opts = {
    'text-to-video':  `<div class="input-group" style="flex:1;min-width:140px;"><label>Длительность</label><div class="input-wrap"><input type="number" value="5" min="1" max="30" /></div></div><div class="input-group" style="flex:1;min-width:140px;"><label>Качество</label><div class="input-wrap"><select style="background:none;border:none;outline:none;color:var(--text-primary);font-family:inherit;font-size:13px;width:100%;"><option>720p</option><option selected>1080p</option><option>4K</option></select></div></div>`,
    'text-to-image':  `<div class="input-group" style="flex:1;min-width:140px;"><label>Размер</label><div class="input-wrap"><select style="background:none;border:none;outline:none;color:var(--text-primary);font-family:inherit;font-size:13px;width:100%;"><option>512×512</option><option selected>1024×1024</option><option>1920×1080</option></select></div></div><div class="input-group" style="flex:1;min-width:140px;"><label>Стиль</label><div class="input-wrap"><select style="background:none;border:none;outline:none;color:var(--text-primary);font-family:inherit;font-size:13px;width:100%;"><option>Реализм</option><option>Аниме</option><option>Цифровое искусство</option><option>Фото</option></select></div></div>`,
    'text-to-speech': `<div class="input-group" style="flex:1;min-width:140px;"><label>Голос</label><div class="input-wrap"><select style="background:none;border:none;outline:none;color:var(--text-primary);font-family:inherit;font-size:13px;width:100%;"><option>Женский</option><option>Мужской</option><option>Нейтральный</option></select></div></div><div class="input-group" style="flex:1;min-width:140px;"><label>Скорость</label><div class="input-wrap"><input type="range" min="0.5" max="2" step="0.1" value="1" style="width:100%;accent-color:var(--accent);" /></div></div>`,
    'text-to-music':  `<div class="input-group" style="flex:1;min-width:140px;"><label>Длительность (сек)</label><div class="input-wrap"><input type="number" value="30" min="5" max="120" /></div></div><div class="input-group" style="flex:1;min-width:140px;"><label>Жанр</label><div class="input-wrap"><select style="background:none;border:none;outline:none;color:var(--text-primary);font-family:inherit;font-size:13px;width:100%;"><option>Ambient</option><option>Поп</option><option>Классика</option><option>Электронная</option><option>Lo-fi</option></select></div></div>`,
  };
  return opts[id] || '';
}

function handleFile(input) {
  const file = input.files[0];
  if (!file) return;
  document.getElementById('uploadLabel').innerHTML = `<strong>${file.name}</strong><span style="font-size:11px;color:var(--accent);display:block;margin-top:4px;">Файл загружен ✓</span>`;
}

async function runGenerate(toolId) {
  const btn    = document.getElementById('genBtn');
  const output = document.getElementById('toolOutput');
  const prompt = document.getElementById('toolPrompt')?.value?.trim() || '';

  if (!prompt) {
    output.classList.add('has-content');
    output.innerHTML = '<div style="color:var(--red)">⚠️ Введите описание (промпт) для генерации</div>';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite;"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0"/></svg> Генерация...`;
  output.innerHTML = `<div class="typing-dot"><span></span><span></span><span></span></div>`;
  output.classList.remove('has-content');

  try {
    // Определяем endpoint по типу инструмента
    let endpoint = '/api/ai/image';
    let body = { prompt };

    if (toolId.includes('video') || toolId === 'lip-sync' || toolId === 'speech-to-video') {
      endpoint = '/api/ai/video';
    } else if (toolId === 'text-to-music') {
      endpoint = '/api/ai/music';
    }

    const res  = await fetch(endpoint, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(body),
    });
    const json = await res.json();

    if (!json.ok) throw new Error(json.error || 'Ошибка запуска задачи');

    const jobId = json.data.id;

    // Polling каждые 3 секунды
    output.classList.add('has-content');
    output.innerHTML = `<div style="font-size:12px;color:var(--text-muted);">⏳ Задача в очереди... (ID: ${jobId.slice(0,8)})</div>`;

    const poll = setInterval(async () => {
      try {
        const statusRes  = await fetch(`/api/ai/job/${jobId}`);
        const statusJson = await statusRes.json();
        const job        = statusJson.data;

        if (job.status === 'success') {
          clearInterval(poll);
          btn.disabled = false;
          btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg> Сгенерировать`;
          output.innerHTML = demoOutput(toolId, job.result_url);
        } else if (job.status === 'failed') {
          clearInterval(poll);
          btn.disabled = false;
          btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg> Сгенерировать`;
          output.innerHTML = `<div style="color:var(--red)">⚠️ Ошибка: ${job.error || 'Генерация не удалась'}</div>`;
        }
      } catch { /* продолжаем polling */ }
    }, 3000);

  } catch (err) {
    btn.disabled = false;
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg> Сгенерировать`;
    output.classList.add('has-content');
    output.innerHTML = `<div style="color:var(--red)">⚠️ ${err.message}</div>`;
  }
}

function demoOutput(id, resultUrl) {
  if (id.includes('image') || id.includes('image-editing')) {
    if (resultUrl) {
      return `<div style="text-align:center;padding:16px;">
        <img src="${resultUrl}" alt="Результат" style="max-width:100%;border-radius:var(--radius);margin-bottom:12px;"/>
        <div style="display:flex;gap:8px;justify-content:center;">
          <a href="${resultUrl}" download class="btn btn-primary btn-sm">Скачать</a>
          <button class="btn btn-ghost btn-sm" onclick="navigator.clipboard.writeText('${resultUrl}');this.textContent='Скопировано ✓';setTimeout(()=>this.textContent='Копировать URL',1500)">Копировать URL</button>
        </div>
      </div>`;
    }
    return `<div style="text-align:center;padding:20px;opacity:.6;"><div style="font-size:40px;margin-bottom:8px;">🖼️</div><div>Изображение готово</div></div>`;
  }
  if (id.includes('video') || id === 'lip-sync' || id === 'speech-to-video') {
    if (resultUrl) {
      return `<div style="text-align:center;padding:16px;">
        <video src="${resultUrl}" controls style="max-width:100%;border-radius:var(--radius);margin-bottom:12px;"></video>
        <a href="${resultUrl}" download class="btn btn-primary btn-sm">Скачать MP4</a>
      </div>`;
    }
    return `<div style="text-align:center;padding:20px;opacity:.6;"><div style="font-size:40px;margin-bottom:8px;">🎬</div><div>Видео готово</div></div>`;
  }
  if (id.includes('music') || id.includes('audio') || id === 'text-to-speech') {
    if (resultUrl) {
      return `<div style="padding:16px;">
        <audio src="${resultUrl}" controls style="width:100%;margin-bottom:12px;"></audio>
        <a href="${resultUrl}" download class="btn btn-primary btn-sm">Скачать MP3</a>
      </div>`;
    }
    return `<div style="text-align:center;padding:20px;opacity:.6;"><div style="font-size:40px;margin-bottom:8px;">🎵</div><div>Аудио готово</div></div>`;
  }
  return `<div style="color:var(--accent);font-size:13px;">✓ Готово ${resultUrl ? `<a href="${resultUrl}" target="_blank" style="color:var(--accent)">Открыть</a>` : ''}</div>`;
}

// ── CHAT ──
function renderChat() {
  document.getElementById('aiMain').innerHTML = `
    <div class="tool-topbar">
      <div class="tool-icon-big">💬</div>
      <div>
        <div class="tool-title">Чат</div>
        <div class="tool-subtitle">Диалог с ИИ-ассистентом</div>
      </div>
      <button class="btn btn-ghost btn-sm" style="margin-left:auto;" onclick="clearChat()">Очистить чат</button>
    </div>
    <div class="chat-wrap-inner">
      <div class="chat-feed" id="chatFeed"></div>
      <div class="chat-input-bar">
        <textarea id="chatInput" rows="1" placeholder="Напишите сообщение... (Enter — отправить, Shift+Enter — новая строка)"
          onkeydown="handleChatKey(event)" oninput="autoResize(this)"></textarea>
        <button class="chat-send" id="chatSendBtn" onclick="sendChat()" title="Отправить">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/></svg>
        </button>
      </div>
    </div>`;
  renderChatFeed();
}

function renderChatFeed() {
  const feed = document.getElementById('chatFeed');
  if (!feed) return;
  if (chatHistory.length === 0) {
    feed.innerHTML = `
      <div class="chat-empty">
        <div class="chat-empty-icon">💬</div>
        <div class="chat-welcome">ИИ-ассистент</div>
        <div class="chat-welcome-sub">Задайте любой вопрос. Я готов помочь с задачами проекта, кодом, текстами и идеями.</div>
        <div class="chat-starters">
          <button class="starter-btn" onclick="startChat('Помоги написать техническое задание')">📋 ТЗ для задачи</button>
          <button class="starter-btn" onclick="startChat('Проверь этот код на ошибки')">🔍 Проверить код</button>
          <button class="starter-btn" onclick="startChat('Напиши краткое описание проекта BAZZAR MARKET')">📝 Описание проекта</button>
          <button class="starter-btn" onclick="startChat('Придумай идеи для улучшения продукта')">💡 Идеи</button>
        </div>
      </div>`;
    return;
  }
  const now = new Date();
  feed.innerHTML = chatHistory.map(m => `
    <div class="msg ${m.role}">
      <div class="msg-bubble">${escChat(m.content)}</div>
      <div class="msg-meta">${m.time}</div>
    </div>`).join('');
  feed.scrollTop = feed.scrollHeight;
}

function escChat(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function startChat(text) {
  const input = document.getElementById('chatInput');
  if (input) { input.value = text; input.focus(); }
  sendChat();
}

function clearChat() {
  chatHistory = [];
  renderChatFeed();
}

function handleChatKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChat();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function ftime() {
  const d = new Date();
  return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
}

async function sendChat() {
  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('chatSendBtn');
  if (!input || isLoading) return;

  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  isLoading = true;
  if (sendBtn) sendBtn.disabled = true;

  chatHistory.push({role:'user', content:text, time:ftime()});
  renderChatFeed();

  // Add typing indicator
  const feed = document.getElementById('chatFeed');
  if (feed) {
    const typing = document.createElement('div');
    typing.className = 'typing-dot';
    typing.id = 'typingIndicator';
    typing.innerHTML = '<span></span><span></span><span></span>';
    feed.appendChild(typing);
    feed.scrollTop = feed.scrollHeight;
  }

  try {
    const messages = chatHistory
      .filter(m => m.role !== 'typing')
      .map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content }));

    // Запрос идёт через НАШ backend-прокси /api/ai/chat
    // API ключ хранится на сервере в .env — браузер его не видит
    const res = await fetch('/api/ai/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [
          { role: 'system', content: 'Ты — умный ИИ-ассистент для команды проекта BAZZAR. Отвечай на русском языке. Помогай с задачами проекта, кодом, текстами и идеями. Отвечай чётко и по делу.' },
          ...messages,
        ],
        model: 'gpt-4o-mini',
        max_tokens: 1024,
        temperature: 0.7,
      }),
    });

    const typing2 = document.getElementById('typingIndicator');
    if (typing2) typing2.remove();

    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: 'Ошибка соединения с API' }));
      throw new Error(err.error || `HTTP ${res.status}`);
    }

    const json = await res.json();
    // Наш API возвращает { ok: true, data: { content: "..." } }
    const reply = json.data?.content || json.choices?.[0]?.message?.content || 'Пустой ответ от API';
    chatHistory.push({role:'ai', content:reply, time:ftime()});
  } catch (err) {
    const typing2 = document.getElementById('typingIndicator');
    if (typing2) typing2.remove();
    chatHistory.push({role:'ai', content:`⚠️ Ошибка: ${err.message}\n\nПроверьте API ключ и подключение к интернету.`, time:ftime()});
  }

  isLoading = false;
  if (sendBtn) sendBtn.disabled = false;
  renderChatFeed();
  const inp2 = document.getElementById('chatInput');
  if (inp2) inp2.focus();
}

</script>
