<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAZZAR — Сотрудники</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .emp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 14px; }
    .emp-card { cursor: pointer; transition: border-color .2s, transform .15s; }
    .emp-card:hover { border-color: rgba(170,255,71,.3); transform: translateY(-2px); }
    .emp-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .emp-avatar { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; flex-shrink: 0; }
    .emp-name { font-size: 14px; font-weight: 600; }
    .emp-role { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .emp-stats { display: flex; gap: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .emp-stat { flex: 1; text-align: center; }
    .emp-stat .v { font-size: 16px; font-weight: 700; color: var(--accent); }
    .emp-stat .l { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
    .search-bar { display: flex; align-items: center; gap: 10px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 14px; flex: 1; max-width: 320px; }
    .search-bar input { background: none; border: none; outline: none; color: var(--text-primary); font-size: 13px; font-family: inherit; width: 100%; }
    .search-bar input::placeholder { color: var(--text-muted); }
    .filter-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-btn { padding: 7px 14px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; border: 1px solid var(--border); background: transparent; color: var(--text-sub); cursor: pointer; transition: all .15s; }
    .filter-btn.active, .filter-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    .online-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; margin-right: 4px; }
    .offline-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); display: inline-block; margin-right: 4px; }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title">Сотрудники</div>
      <div class="topbar-actions">
        <div class="search-bar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" placeholder="Поиск сотрудника..." id="searchInput" oninput="filterEmployees()" />
        </div>
        <button class="btn btn-primary btn-sm" onclick="alert('Добавить сотрудника')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          Добавить
        </button>
      </div>
    </div>
    <div class="content">
      <div class="filter-row">
        <button class="filter-btn active" onclick="setFilter(this,'all')">Все (24)</button>
        <button class="filter-btn" onclick="setFilter(this,'online')"><span class="online-dot"></span>Онлайн (12)</button>
        <button class="filter-btn" onclick="setFilter(this,'dev')">Разработка</button>
        <button class="filter-btn" onclick="setFilter(this,'design')">Дизайн</button>
        <button class="filter-btn" onclick="setFilter(this,'ops')">Операции</button>
      </div>
      <div class="emp-grid" id="empGrid"></div>
    </div>
  </div>
</div>

<script src="nav.js"></script>
<script>
  initNav('employees');

  const colors = ['#AAFF47','#FFD166','#FF9F47','#47C8FF','#C847FF'];
  const bgs    = ['rgba(170,255,71,.15)','rgba(255,209,102,.15)','rgba(255,159,71,.15)','rgba(71,200,255,.15)','rgba(200,71,255,.15)'];

  const employees = [
    {name:'Мария Смирнова',role:'Frontend Dev',dept:'dev',tasks:14,kpi:92,online:true},
    {name:'Иван Петров',role:'Backend Dev',dept:'dev',tasks:9,kpi:78,online:true},
    {name:'Анна Козлова',role:'UI/UX Designer',dept:'design',tasks:7,kpi:85,online:true},
    {name:'Дмитрий Новиков',role:'DevOps',dept:'ops',tasks:5,kpi:60,online:false},
    {name:'Елена Жукова',role:'QA Engineer',dept:'dev',tasks:11,kpi:95,online:true},
    {name:'Алексей Ким',role:'Project Manager',dept:'ops',tasks:22,kpi:88,online:true},
    {name:'Ольга Тарасова',role:'Backend Dev',dept:'dev',tasks:8,kpi:74,online:false},
    {name:'Сергей Волков',role:'Mobile Dev',dept:'dev',tasks:10,kpi:81,online:true},
    {name:'Наталья Орлова',role:'Graphic Designer',dept:'design',tasks:6,kpi:90,online:false},
    {name:'Павел Соколов',role:'Data Analyst',dept:'ops',tasks:12,kpi:83,online:true},
    {name:'Юлия Фёдорова',role:'Frontend Dev',dept:'dev',tasks:9,kpi:77,online:true},
    {name:'Андрей Морозов',role:'System Admin',dept:'ops',tasks:4,kpi:70,online:false},
  ];

  let currentFilter = 'all';
  let searchQuery = '';

  function renderEmployees() {
    const grid = document.getElementById('empGrid');
    const filtered = employees.filter(e => {
      const matchFilter = currentFilter === 'all' || (currentFilter === 'online' && e.online) || e.dept === currentFilter;
      const matchSearch = e.name.toLowerCase().includes(searchQuery) || e.role.toLowerCase().includes(searchQuery);
      return matchFilter && matchSearch;
    });
    grid.innerHTML = filtered.map((e,i) => {
      const ci = i % colors.length;
      const ini = e.name.split(' ').map(w=>w[0]).join('').slice(0,2);
      const kpiColor = e.kpi >= 80 ? 'var(--accent)' : e.kpi >= 65 ? 'var(--yellow)' : 'var(--red)';
      return `
        <div class="card emp-card">
          <div class="emp-head">
            <div class="emp-avatar" style="background:${bgs[ci]};color:${colors[ci]};">${ini}</div>
            <div>
              <div class="emp-name">${e.name}</div>
              <div class="emp-role">${e.online?'<span class="online-dot"></span>':'<span class="offline-dot"></span>'}${e.role}</div>
            </div>
          </div>
          <div style="margin-bottom:10px;">
            <div style="display:flex;justify-content:space-between;margin-bottom:5px;">
              <span style="font-size:11px;color:var(--text-muted);">KPI</span>
              <span style="font-size:11px;font-weight:700;color:${kpiColor}">${e.kpi}%</span>
            </div>
            <div class="kpi-bar"><div class="kpi-bar-fill" style="width:${e.kpi}%;background:${kpiColor};"></div></div>
          </div>
          <div class="emp-stats">
            <div class="emp-stat"><div class="v">${e.tasks}</div><div class="l">Задач</div></div>
            <div class="emp-stat"><div class="v">${e.kpi}%</div><div class="l">KPI</div></div>
            <div class="emp-stat"><div class="v">${e.online?'<span style="color:var(--accent)">●</span>':'<span style="color:var(--text-muted)">●</span>'}</div><div class="l">${e.online?'Онлайн':'Офлайн'}</div></div>
          </div>
        </div>`;
    }).join('');
  }

  function setFilter(btn, filter) {
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = filter;
    renderEmployees();
  }

  function filterEmployees() {
    searchQuery = document.getElementById('searchInput').value.toLowerCase();
    renderEmployees();
  }

  renderEmployees();
</script>
</body>
</html>
