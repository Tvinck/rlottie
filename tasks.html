<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAZZAR — Задачи</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .kanban { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; align-items: start; }
    .kanban-col { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
    .col-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .col-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
    .col-count { font-size: 11px; font-weight: 700; background: var(--bg-card2); padding: 2px 8px; border-radius: 10px; color: var(--text-muted); }
    .task-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 8px; cursor: pointer; transition: border-color .15s; }
    .task-card:hover { border-color: rgba(170,255,71,.3); }
    .task-card:last-child { margin-bottom: 0; }
    .task-title { font-size: 13px; font-weight: 500; margin-bottom: 8px; line-height: 1.4; }
    .task-meta { display: flex; align-items: center; justify-content: space-between; }
    .task-assignee { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); }
    .task-due { font-size: 10px; color: var(--text-muted); }
    .task-due.overdue { color: var(--red); }
    .task-tag { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px; margin-bottom: 8px; display: inline-block; }
    .tag-dev  { background:rgba(170,255,71,.12); color:var(--accent); }
    .tag-design { background:rgba(71,200,255,.12); color:#47C8FF; }
    .tag-ops  { background:rgba(255,209,102,.12); color:var(--yellow); }
    .tag-bug  { background:rgba(255,90,90,.12); color:var(--red); }
    .add-task-btn { width:100%; padding:8px; border-radius:var(--radius-sm); border:1px dashed var(--border); background:transparent; color:var(--text-muted); font-size:12px; cursor:pointer; transition:all .15s; margin-top:8px; font-family:inherit; }
    .add-task-btn:hover { border-color:var(--accent); color:var(--accent); }
    .priority-dot { width:6px;height:6px;border-radius:50%;flex-shrink:0; }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title">Задачи</div>
      <div class="topbar-tabs">
        <button class="tab active">Канбан</button>
        <button class="tab">Список</button>
        <button class="tab">По сотрудникам</button>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" onclick="alert('Новая задача')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          Новая задача
        </button>
      </div>
    </div>
    <div class="content">
      <div class="kanban" id="kanban"></div>
    </div>
  </div>
</div>

<script src="nav.js"></script>
<script>
  initNav('tasks');

  const columns = [
    {
      id:'backlog', title:'Бэклог', color:'var(--text-muted)',
      tasks:[
        {title:'Настроить CI/CD пайплайн',tag:'ops',assignee:'ДН',due:'28 мая',priority:'low'},
        {title:'Написать тесты для API авторизации',tag:'dev',assignee:'ОТ',due:'30 мая',priority:'med'},
        {title:'Обновить дизайн-систему',tag:'design',assignee:'НО',due:'2 июн',priority:'low'},
        {title:'Исправить баг #234 — падение при сортировке',tag:'bug',assignee:'ИП',due:'27 мая',priority:'high'},
      ]
    },
    {
      id:'inprogress', title:'В работе', color:'var(--yellow)',
      tasks:[
        {title:'Разработать экран онбординга',tag:'dev',assignee:'МС',due:'25 мая',priority:'high'},
        {title:'Интеграция платёжного шлюза',tag:'dev',assignee:'ИП',due:'26 мая',priority:'high'},
        {title:'Редизайн карточки сотрудника',tag:'design',assignee:'АК',due:'24 мая',priority:'med'},
        {title:'Оптимизация SQL-запросов',tag:'dev',assignee:'ОТ',due:'27 мая',priority:'med'},
        {title:'Настройка мониторинга Grafana',tag:'ops',assignee:'ДН',due:'29 мая',priority:'low'},
      ]
    },
    {
      id:'review', title:'На проверке', color:'#47C8FF',
      tasks:[
        {title:'Модуль отчётности HR',tag:'dev',assignee:'СВ',due:'23 мая',priority:'high'},
        {title:'Анимации переходов в приложении',tag:'design',assignee:'АК',due:'22 мая',priority:'low'},
        {title:'Баг #198 — некорректный расчёт',tag:'bug',assignee:'ЕЖ',due:'21 мая',priority:'high'},
      ]
    },
    {
      id:'done', title:'Готово', color:'var(--accent)',
      tasks:[
        {title:'Система уведомлений push',tag:'dev',assignee:'МС',due:'20 мая',priority:'med'},
        {title:'Страница настроек профиля',tag:'dev',assignee:'ЮФ',due:'19 мая',priority:'low'},
        {title:'Логотип и брендинг BAZZAR',tag:'design',assignee:'НО',due:'18 мая',priority:'med'},
        {title:'Деплой на прод — v2.1.0',tag:'ops',assignee:'ДН',due:'17 мая',priority:'high'},
        {title:'Миграция базы данных',tag:'dev',assignee:'АМ',due:'16 мая',priority:'high'},
      ]
    },
  ];

  const priorityColors = {high:'var(--red)',med:'var(--yellow)',low:'var(--text-muted)'};
  const tagClass = {dev:'tag-dev',design:'tag-design',ops:'tag-ops',bug:'tag-bug'};
  const tagLabel = {dev:'Разработка',design:'Дизайн',ops:'Операции',bug:'Баг'};

  const kanban = document.getElementById('kanban');
  columns.forEach(col => {
    kanban.innerHTML += `
      <div class="kanban-col">
        <div class="col-head">
          <div class="col-title" style="color:${col.color}">${col.title}</div>
          <span class="col-count">${col.tasks.length}</span>
        </div>
        ${col.tasks.map(t => `
          <div class="task-card">
            <span class="task-tag ${tagClass[t.tag]}">${tagLabel[t.tag]}</span>
            <div class="task-title">${t.title}</div>
            <div class="task-meta">
              <div class="task-assignee">
                <div class="avatar" style="width:20px;height:20px;font-size:9px;background:var(--accent-dim);color:var(--accent);">${t.assignee}</div>
                ${t.assignee}
              </div>
              <div style="display:flex;align-items:center;gap:5px;">
                <div class="priority-dot" style="background:${priorityColors[t.priority]}"></div>
                <span class="task-due ${col.id==='inprogress'&&t.priority==='high'?'overdue':''}">${t.due}</span>
              </div>
            </div>
          </div>
        `).join('')}
        <button class="add-task-btn" onclick="alert('Добавить задачу в «${col.title}»')">+ Добавить задачу</button>
      </div>`;
  });

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => { document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); tab.classList.add('active'); });
  });
</script>
</body>
</html>
