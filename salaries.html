<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAZZAR — Зарплаты</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .salary-table td, .salary-table th { padding: 13px 12px; }
    .salary-table th { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--border); font-weight: 500; }
    .salary-table td { font-size: 13px; border-bottom: 1px solid rgba(255,255,255,.03); }
    .salary-table tr:hover td { background: rgba(255,255,255,.02); }
    .salary-amount { font-weight: 700; font-size: 14px; }
    .bonus-pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: rgba(170,255,71,.12); color: var(--accent); }
    .status-paid { background: rgba(170,255,71,.12); color: var(--accent); }
    .status-pending { background: rgba(255,209,102,.12); color: var(--yellow); }
    .status-hold { background: rgba(255,90,90,.12); color: var(--red); }
    .summary-cards { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-bottom: 20px; }
    .sum-card { text-align: center; }
    .sum-val { font-size: 26px; font-weight: 800; }
    .sum-lbl { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title">Зарплаты</div>
      <div class="topbar-tabs">
        <button class="tab active">Май 2025</button>
        <button class="tab">Апрель</button>
        <button class="tab">Март</button>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" onclick="alert('Выплатить всем')">Выплатить всем</button>
      </div>
    </div>
    <div class="content">
      <div class="summary-cards">
        <div class="card sum-card">
          <div class="sum-val">₽ 386 400</div>
          <div class="sum-lbl">Общий ФОТ</div>
        </div>
        <div class="card sum-card">
          <div class="sum-val" style="color:var(--accent);">₽ 312 000</div>
          <div class="sum-lbl">Выплачено</div>
        </div>
        <div class="card sum-card">
          <div class="sum-val" style="color:var(--yellow);">₽ 74 400</div>
          <div class="sum-lbl">Ожидает выплаты</div>
        </div>
      </div>

      <div class="card">
        <div class="table-header">
          <div class="table-title">Ведомость — Май 2025</div>
          <button class="btn btn-ghost btn-sm" onclick="alert('Экспорт')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Экспорт
          </button>
        </div>
        <table class="table salary-table" style="width:100%;">
          <thead>
            <tr>
              <th>Сотрудник</th>
              <th>Должность</th>
              <th>Оклад</th>
              <th>Бонус</th>
              <th>Итого</th>
              <th>Статус</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="salaryBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="nav.js"></script>
<script>
  initNav('salaries');

  const salaries = [
    {name:'Мария Смирнова',role:'Frontend Dev',base:85000,bonus:12000,status:'paid'},
    {name:'Иван Петров',role:'Backend Dev',base:90000,bonus:8000,status:'paid'},
    {name:'Анна Козлова',role:'UI/UX Designer',base:75000,bonus:10000,status:'paid'},
    {name:'Дмитрий Новиков',role:'DevOps',base:95000,bonus:0,status:'pending'},
    {name:'Елена Жукова',role:'QA Engineer',base:70000,bonus:15000,status:'paid'},
    {name:'Алексей Ким',role:'Project Manager',base:100000,bonus:20000,status:'paid'},
    {name:'Ольга Тарасова',role:'Backend Dev',base:85000,bonus:0,status:'hold'},
    {name:'Сергей Волков',role:'Mobile Dev',base:88000,bonus:6000,status:'pending'},
    {name:'Наталья Орлова',role:'Graphic Designer',base:68000,bonus:5000,status:'paid'},
    {name:'Павел Соколов',role:'Data Analyst',base:82000,bonus:9000,status:'paid'},
    {name:'Юлия Фёдорова',role:'Frontend Dev',base:78000,bonus:7000,status:'paid'},
    {name:'Андрей Морозов',role:'System Admin',base:80000,bonus:0,status:'pending'},
  ];

  const statusLabel = {paid:'Выплачено',pending:'Ожидание',hold:'Заморожено'};
  const statusClass = {paid:'status-paid',pending:'status-pending',hold:'status-hold'};

  const tbody = document.getElementById('salaryBody');
  salaries.forEach(s => {
    const ini = s.name.split(' ').map(w=>w[0]).join('').slice(0,2);
    const total = s.base + s.bonus;
    tbody.innerHTML += `
      <tr>
        <td><div class="client-cell"><div class="avatar" style="width:30px;height:30px;font-size:11px;background:var(--accent-dim);color:var(--accent);">${ini}</div>${s.name}</div></td>
        <td style="color:var(--text-muted)">${s.role}</td>
        <td><span class="salary-amount">₽ ${s.base.toLocaleString('ru')}</span></td>
        <td>${s.bonus>0?`<span class="bonus-pill">+₽ ${s.bonus.toLocaleString('ru')}</span>`:'<span style="color:var(--text-muted)">—</span>'}</td>
        <td><span class="salary-amount" style="color:var(--accent)">₽ ${total.toLocaleString('ru')}</span></td>
        <td><span class="badge ${statusClass[s.status]}">${statusLabel[s.status]}</span></td>
        <td>${s.status!=='paid'?`<button class="btn btn-primary btn-sm" onclick="alert('Выплатить ${s.name}')">Выплатить</button>`:''}</td>
      </tr>`;
  });

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => { document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); tab.classList.add('active'); });
  });
</script>
<script src="notifications.js"></script>
<script>initNotifications();</script>
</body>
</html>
