<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAZZAR — Проект</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .proj-sidebar {
      width: 220px; flex-shrink: 0; background: var(--bg-secondary);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      padding: 20px 14px; overflow-y: auto;
    }
    .proj-back { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); cursor: pointer; padding: 6px 8px; border-radius: var(--radius-sm); transition: all .15s; text-decoration: none; margin-bottom: 16px; }
    .proj-back:hover { color: var(--text-primary); background: var(--bg-card2); }
    .proj-header-block { padding: 12px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 20px; }
    .proj-icon-sm { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 8px; }
    .proj-title-sm { font-size: 14px; font-weight: 700; }
    .proj-status-sm { font-size: 10px; color: var(--accent); margin-top: 2px; }
    .pnav-section { margin-bottom: 20px; }
    .pnav-label { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .07em; padding: 0 8px; margin-bottom: 6px; }
    .pnav-item {
      display: flex; align-items: center; gap: 9px; padding: 9px 10px;
      border-radius: var(--radius-sm); font-size: 13px; font-weight: 500;
      color: var(--text-sub); cursor: pointer; transition: all .15s; border: none;
      background: transparent; width: 100%; text-align: left; font-family: inherit; margin-bottom: 1px;
    }
    .pnav-item:hover  { background: var(--bg-card2); color: var(--text-primary); }
    .pnav-item.active { background: var(--accent-dim); color: var(--accent); }
    .section { display: none; }
    .section.active { display: block; }

    /* ─── CHAT ─── */
    .chat-wrap { display: grid; grid-template-columns: 220px 1fr; gap: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; height: calc(100vh - 130px); }
    .chat-channels { background: var(--bg-secondary); border-right: 1px solid var(--border); padding: 12px; overflow-y: auto; }
    .ch-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; color: var(--text-sub); transition: all .15s; }
    .ch-item:hover, .ch-item.active { background: var(--bg-card2); color: var(--text-primary); }
    .ch-item.active { color: var(--accent); }
    .chat-main { display: flex; flex-direction: column; background: var(--bg-card); }
    .chat-head { padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .chat-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .chat-foot { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
    .chat-input { flex: 1; background: var(--bg-card2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; color: var(--text-primary); font-size: 13px; font-family: inherit; outline: none; }
    .chat-input:focus { border-color: var(--accent); }
    .bubble { max-width: 65%; }
    .bubble.own { align-self: flex-end; }
    .bubble.other { align-self: flex-start; }
    .bubble-body { padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.5; }
    .bubble.own   .bubble-body { background: var(--accent); color: #0B0B14; border-radius: 14px 14px 4px 14px; }
    .bubble.other .bubble-body { background: var(--bg-card2); border-radius: 14px 14px 14px 4px; }
    .bubble-meta { font-size: 10px; color: var(--text-muted); margin-top: 3px; }
    .bubble.own .bubble-meta { text-align: right; }

    /* ─── KANBAN ─── */
    .kanban { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; align-items: start; }
    .k-col { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
    .k-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .k-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    .k-count { font-size: 11px; background: var(--bg-card2); padding: 1px 7px; border-radius: 8px; color: var(--text-muted); }
    .k-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px; margin-bottom: 7px; cursor: pointer; transition: border-color .15s; }
    .k-card:hover { border-color: rgba(170,255,71,.3); }
    .k-card-title { font-size: 12px; font-weight: 500; line-height: 1.4; margin-bottom: 8px; }
    .k-card-foot { display: flex; align-items: center; justify-content: space-between; }
    .k-tag { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 3px; }
    .add-k { width:100%;padding:7px;border-radius:var(--radius-sm);border:1px dashed var(--border);background:transparent;color:var(--text-muted);font-size:11px;cursor:pointer;transition:all .15s;margin-top:6px;font-family:inherit; }
    .add-k:hover { border-color:var(--accent);color:var(--accent); }

    /* ─── FINANCE ─── */
    .fin-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-bottom: 16px; }
    .fin-table td, .fin-table th { padding: 11px 10px; }
    .fin-table th { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--border); font-weight: 500; }
    .fin-table td { font-size: 13px; border-bottom: 1px solid rgba(255,255,255,.03); }

    /* ─── TEAM ─── */
    .team-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(240px,1fr)); gap: 12px; }
    .t-card { text-align: center; padding: 20px 16px; }
    .t-avatar { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; margin: 0 auto 10px; }
    .t-name { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
    .t-role { font-size: 11px; color: var(--text-muted); margin-bottom: 12px; }
    .t-kpi-wrap { display: flex; justify-content: center; gap: 16px; padding-top: 10px; border-top: 1px solid var(--border); }
    .t-stat .v { font-size: 14px; font-weight: 700; }
    .t-stat .l { font-size: 9px; color: var(--text-muted); margin-top: 1px; }
  </style>
</head>
<body>
<div class="layout">

  <!-- PROJECT SIDEBAR -->
  <aside class="proj-sidebar" id="projSidebar"></aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar" id="projTopbar">
      <div class="topbar-title" id="sectionTitle">Чаты</div>
      <div class="topbar-actions">
        <div class="icon-btn" onclick="openNotifications()" style="position:relative;" title="Уведомления">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notif-bell-badge" style="position:absolute;top:-4px;right:-4px;background:var(--accent);color:#0B0B14;font-size:8px;font-weight:800;border-radius:8px;padding:1px 4px;min-width:14px;text-align:center;line-height:14px;"></span>
        </div>
        <div class="avatar" style="background:var(--accent-dim);color:var(--accent);cursor:pointer;">АК</div>
      </div>
    </div>

    <div class="content" id="projContent"></div>
  </div>
</div>

<script>
  // ─── PROJECT DATA ───────────────────────────────────────────
  const PROJECTS = {

      icon: '🛍',
      iconBg: 'rgba(170,255,71,.15)',
      iconColor: 'var(--accent)',
      accentColor: 'var(--accent)',
      desc: 'Маркетплейс товаров и услуг',
      team: [
        {name:'Мария Смирнова',role:'Frontend Dev',kpi:92,tasks:14,online:true},
        {name:'Иван Петров',role:'Backend Dev',kpi:78,tasks:9,online:true},
        {name:'Дмитрий Новиков',role:'DevOps',kpi:60,tasks:5,online:false},
        {name:'Елена Жукова',role:'QA Engineer',kpi:95,tasks:11,online:true},
        {name:'Алексей Ким',role:'Project Manager',kpi:88,tasks:22,online:true},
        {name:'Ольга Тарасова',role:'Backend Dev',kpi:74,tasks:8,online:false},
        {name:'Сергей Волков',role:'Mobile Dev',kpi:81,tasks:10,online:true},
        {name:'Андрей Морозов',role:'System Admin',kpi:70,tasks:4,online:false},
      ],
      channels: ['# general','# разработка','# деплой','# баги'],
      tasks: {
        'Бэклог': [{t:'Настроить CDN для медиа',tag:'ops'},{t:'Баг #312 — поиск на мобиле',tag:'bug'},{t:'Раздел "Избранное"',tag:'dev'}],
        'В работе': [{t:'Корзина и оформление заказа',tag:'dev'},{t:'Интеграция СМС-уведомлений',tag:'dev'},{t:'Страница продавца',tag:'dev'},{t:'Редизайн главной страницы',tag:'design'}],
        'Ревью':   [{t:'API поиска товаров',tag:'dev'},{t:'Баг #298 — дублирование товара',tag:'bug'}],
        'Готово':  [{t:'Авторизация OAuth',tag:'dev'},{t:'Загрузка фото товаров',tag:'dev'},{t:'Фильтры каталога',tag:'dev'}],
      },
      finance: [

        {desc:'Дизайн UI/UX',cat:'design',sum:75000,status:'paid',date:'05 мая'},
        {desc:'Маркетинг/продвижение',cat:'ops',sum:40000,status:'pending',date:'10 мая'},
        {desc:'DevOps и инфраструктура',cat:'ops',sum:55000,status:'paid',date:'12 мая'},
        {desc:'QA тестирование',cat:'dev',sum:35000,status:'pending',date:'20 мая'},
        {desc:'Премия за деплой',cat:'dev',sum:25000,status:'pending',date:'21 мая'},
      ],
      msgs: [
        {own:false,from:'Алексей',text:'Всем привет! Сегодня в 15:00 демо для клиента.',time:'09:00'},
        {own:false,from:'Мария',text:'Корзина готова, выкатываю на стейдж.',time:'09:30'},
        {own:true,from:'Вы',text:'Отлично! Проверю после обеда.',time:'09:35'},
        {own:false,from:'Иван',text:'API поиска задеплоен, можете тестить.',time:'10:15'},
        {own:false,from:'Елена',text:'Нашла баг в фильтрах — создала тикет #312.',time:'10:40'},
        {own:true,from:'Вы',text:'Принял, Дмитрий смотрит. До демо успеем.',time:'10:45'},
      ],
    },
    'pixel': {
      name: 'PIXEL',
      icon: '🎨',
      iconBg: 'rgba(200,71,255,.15)',
      iconColor: '#C847FF',
      accentColor: '#C847FF',
      desc: 'Дизайн-студия',
      team: [
        {name:'Анна Козлова',role:'Lead Designer',kpi:85,tasks:7,online:true},
        {name:'Наталья Орлова',role:'Graphic Designer',kpi:90,tasks:6,online:false},
        {name:'Юлия Фёдорова',role:'Frontend Dev',kpi:77,tasks:9,online:true},

      ],

      tasks: {

        'Готово':  [{t:'Логотип BAZZAR v2',tag:'design'},{t:'Фирменный стиль MediaGroup',tag:'design'},{t:'Баннеры для маркета',tag:'design'}],

      ],
      msgs: [
        {own:false,from:'Анна',text:'Брендбук TechStart почти готов, сегодня финализирую.',time:'09:10'},
        {own:true,from:'Вы',text:'Отлично, жду на проверку.',time:'09:15'},
        {own:false,from:'Наталья',text:'Баннеры для маркета выложила в Figma.',time:'10:00'},
        {own:false,from:'Павел',text:'Анимация логотипа — какой формат нужен клиенту?',time:'10:30'},
        {own:true,from:'Вы',text:'Нужны .gif и .mp4, спроси у Алексея детали.',time:'10:32'},
      ],
    },
  };

  // ─── INIT ────────────────────────────────────────────────────
  const params = new URLSearchParams(location.search);
  const pid    = params.get('p') || 'bazzar-market';
  const proj   = PROJECTS[pid] || PROJECTS['bazzar-market'];
  let activeSection = 'tasks'; // overwritten below after sections array is built

  document.title = `BAZZAR — ${proj.name}`;

  // ─── SIDEBAR ────────────────────────────────────────────────
  const baseSections = [
    {id:'tasks',    label:'Задания',   icon:`<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>`, badge: Object.values(proj.tasks).flat().length},
    {id:'finance',  label:'Финансы',   icon:`<path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>`},
    {id:'team',     label:'Команда',   icon:`<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>`, badge: proj.team.length},
    {id:'analytics',label:'Аналитика', icon:`<path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>`},
    {id:'settings', label:'Настройки', icon:`<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>`},
  ];

  const sections = pid === 'bazzar-market'
    ? [
        {id:'products', label:'Товары и продажи', icon:`<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>`},
        ...baseSections,
      ]
    : [
        {id:'chats', label:'Чаты', icon:`<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>`},
        ...baseSections,
      ];

  activeSection = sections[0].id;

  document.getElementById('projSidebar').innerHTML = `
    <a href="home.html" class="proj-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Все проекты
    </a>
    <div class="proj-header-block">
      <div class="proj-icon-sm" style="background:${proj.iconBg};color:${proj.iconColor};">${proj.icon}</div>
      <div class="proj-title-sm">${proj.name}</div>
      <div class="proj-status-sm">● Активен · ${proj.team.length} чел.</div>
    </div>
    <div class="pnav-section">
      <div class="pnav-label">Разделы</div>
      ${sections.map(s=>`
        <button class="pnav-item ${s.id===activeSection?'active':''}" id="pnav-${s.id}" onclick="switchSection('${s.id}')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${s.icon}</svg>
          ${s.label}
          ${s.badge?`<span style="margin-left:auto;background:${s.id===activeSection?proj.accentColor:'var(--bg-card2)'};color:${s.id===activeSection?'#0B0B14':'var(--text-muted)'};font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;transition:.15s;">${s.badge}</span>`:''}
        </button>`).join('')}
    </div>
    <div style="margin-top:auto;padding-top:16px;border-top:1px solid var(--border);">
      <div style="display:flex;align-items:center;gap:9px;padding:6px 8px;">

        <div style="flex:1;min-width:0;"><div style="font-size:12px;font-weight:600;">Артём К.</div><div style="font-size:10px;color:var(--text-muted);">Администратор</div></div>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" style="cursor:pointer;" onclick="window.location.href='index.html'"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>

  // ─── SECTIONS ────────────────────────────────────────────────
  const tagCls = {dev:'tag-dev',design:'tag-design',ops:'tag-ops',bug:'tag-bug',marketing:'tag-ops'};
  const tagLbl = {dev:'Dev',design:'Design',ops:'Ops',bug:'Баг',marketing:'Маркетинг'};
  const finCatColor = {dev:'var(--accent)',design:'#C847FF',ops:'var(--yellow)'};

  function buildChats() {
    return `
      <div class="chat-wrap">
        <div class="chat-channels">
          <div style="font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;padding:4px 8px;margin-bottom:6px;">Каналы</div>
          ${proj.channels.map((ch,i)=>`<div class="ch-item ${i===0?'active':''}" onclick="this.parentElement.querySelectorAll('.ch-item').forEach(c=>c.classList.remove('active'));this.classList.add('active')">${ch}</div>`).join('')}

            <div class="ch-item">
              <div style="width:20px;height:20px;border-radius:50%;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex-shrink:0;">${m.name.split(' ').map(w=>w[0]).join('').slice(0,2)}</div>

        <div class="chat-main">
          <div class="chat-head">
            <div style="font-size:13px;font-weight:600;">${proj.channels[0]}</div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">${proj.team.length} участников</div>
          </div>
          <div class="chat-body" id="projChatBody">
            ${proj.msgs.map(m=>`
              <div class="bubble ${m.own?'own':'other'}">
                ${!m.own?`<div style="font-size:11px;font-weight:600;color:${proj.accentColor};margin-bottom:3px;">${m.from}</div>`:''}

                <div class="bubble-meta">${m.time}</div>
              </div>`).join('')}

          <div class="chat-foot">
            <input class="chat-input" placeholder="Написать в ${proj.channels[0]}..." id="projChatInput" onkeydown="if(event.key==='Enter')projSend()" />

              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/></svg>
            </button>
          </div>
        </div>
      </div>`;
  }

  function buildTasks() {
    const cols = Object.entries(proj.tasks);
    const colColors = ['var(--text-muted)','var(--yellow)','#47C8FF','var(--accent)'];
    return `<div class="kanban">
      ${cols.map(([col,tasks],ci)=>`
        <div class="k-col">
          <div class="k-head">
            <div class="k-title" style="color:${colColors[ci]}">${col}</div>
            <span class="k-count">${tasks.length}</span>
          </div>
          ${tasks.map(t=>`
            <div class="k-card">
              <div class="k-card-title">${t.t}</div>
              <div class="k-card-foot">
                <span class="k-tag ${tagCls[t.tag]||'tag-dev'}" style="font-size:10px;font-weight:600;padding:2px 6px;border-radius:3px;">${tagLbl[t.tag]||t.tag}</span>
              </div>
            </div>`).join('')}
          <button class="add-k" onclick="alert('Добавить задачу')">+ Задача</button>
        </div>`).join('')}
    </div>`;
  }

  function buildFinance() {
    const total  = proj.finance.reduce((a,f)=>a+f.sum,0);
    const paid   = proj.finance.filter(f=>f.status==='paid').reduce((a,f)=>a+f.sum,0);
    const pend   = proj.finance.filter(f=>f.status==='pending').reduce((a,f)=>a+f.sum,0);
    return `
      <div class="fin-grid">
        <div class="card" style="text-align:center;">
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;">Бюджет проекта</div>
          <div style="font-size:26px;font-weight:800;">₽ ${total.toLocaleString('ru')}</div>
        </div>
        <div class="card" style="text-align:center;">
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;">Выплачено</div>
          <div style="font-size:26px;font-weight:800;color:var(--accent);">₽ ${paid.toLocaleString('ru')}</div>
        </div>
        <div class="card" style="text-align:center;">
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;">Ожидание</div>
          <div style="font-size:26px;font-weight:800;color:var(--yellow);">₽ ${pend.toLocaleString('ru')}</div>
        </div>
      </div>
      <div class="card">
        <div class="table-header">
          <div class="table-title">Транзакции</div>
          <button class="btn btn-primary btn-sm" onclick="alert('Добавить транзакцию')">+ Добавить</button>
        </div>
        <table class="table fin-table" style="width:100%;">
          <thead><tr><th>Описание</th><th>Категория</th><th>Дата</th><th>Статус</th><th style="text-align:right">Сумма</th></tr></thead>
          <tbody>
            ${proj.finance.map(f=>`
              <tr>
                <td style="font-weight:500">${f.desc}</td>
                <td><span style="font-size:11px;font-weight:600;color:${finCatColor[f.cat]||'var(--accent)'}">${f.cat.toUpperCase()}</span></td>
                <td style="color:var(--text-muted);font-size:12px">${f.date}</td>
                <td><span class="badge ${f.status==='paid'?'badge-green':'badge-yellow'}">${f.status==='paid'?'Оплачено':'Ожидание'}</span></td>
                <td style="text-align:right;font-weight:700">₽ ${f.sum.toLocaleString('ru')}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  }

  function buildTeam() {
    const colors = ['var(--accent)','#C847FF','#47C8FF','var(--yellow)','#FF9F47'];
    const bgs    = ['rgba(170,255,71,.15)','rgba(200,71,255,.15)','rgba(71,200,255,.15)','rgba(255,209,102,.15)','rgba(255,159,71,.15)'];
    return `<div class="team-grid">
      ${proj.team.map((m,i)=>{
        const ci  = i % colors.length;
        const ini = m.name.split(' ').map(w=>w[0]).join('').slice(0,2);
        const kpiColor = m.kpi>=80?'var(--accent)':m.kpi>=65?'var(--yellow)':'var(--red)';
        return `<div class="card t-card">
          <div style="position:relative;display:inline-block;">
            <div class="t-avatar" style="background:${bgs[ci]};color:${colors[ci]}">${ini}</div>
            ${m.online?`<div style="position:absolute;bottom:2px;right:2px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg-card);"></div>`:''}
          </div>
          <div class="t-name">${m.name}</div>
          <div class="t-role">${m.role}</div>
          <div style="margin:0 0 10px;"><div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span style="font-size:10px;color:var(--text-muted);">KPI</span><span style="font-size:10px;font-weight:700;color:${kpiColor}">${m.kpi}%</span></div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:${m.kpi}%;background:${kpiColor}"></div></div></div>
          <div class="t-kpi-wrap">
            <div class="t-stat"><div class="v">${m.tasks}</div><div class="l">Задач</div></div>
            <div class="t-stat"><div class="v">${m.kpi}%</div><div class="l">KPI</div></div>
            <div class="t-stat"><div class="v" style="color:${m.online?'var(--accent)':'var(--text-muted)'}">${m.online?'●':'●'}</div><div class="l">${m.online?'Онлайн':'Офлайн'}</div></div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }

  function buildAnalytics() {
    const totalTasks = Object.values(proj.tasks).flat().length;
    const doneTasks  = proj.tasks['Готово']?.length || 0;
    const total = proj.finance.reduce((a,f)=>a+f.sum,0);
    const paid  = proj.finance.filter(f=>f.status==='paid').reduce((a,f)=>a+f.sum,0);
    const avgKpi = Math.round(proj.team.reduce((a,m)=>a+m.kpi,0)/proj.team.length);
    return `
      <div class="kpi-strip">
        <div class="card kpi-card"><div class="kpi-label">Всего задач</div><div class="kpi-value">${totalTasks}</div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:${(doneTasks/totalTasks*100).toFixed(0)}%"></div></div></div>
        <div class="card kpi-card"><div class="kpi-label">Выполнено</div><div class="kpi-value accent">${doneTasks}</div><div class="kpi-delta"><span class="up">${(doneTasks/totalTasks*100).toFixed(0)}%</span> от всех задач</div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:${(doneTasks/totalTasks*100).toFixed(0)}%"></div></div></div>
        <div class="card kpi-card"><div class="kpi-label">Ср. KPI команды</div><div class="kpi-value">${avgKpi}%</div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:${avgKpi}%"></div></div></div>
        <div class="card kpi-card"><div class="kpi-label">Исполнение бюджета</div><div class="kpi-value accent">₽${(paid/1000).toFixed(0)}k</div><div class="kpi-delta">из ₽${(total/1000).toFixed(0)}k</div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:${(paid/total*100).toFixed(0)}%"></div></div></div>
      </div>
      <div class="card" style="margin-top:14px;">
        <div class="table-title" style="margin-bottom:14px;">Производительность команды</div>
        ${proj.team.map(m=>{
          const ini = m.name.split(' ').map(w=>w[0]).join('').slice(0,2);
          const kpiColor = m.kpi>=80?'var(--accent)':m.kpi>=65?'var(--yellow)':'var(--red)';
          return `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);">
            <div class="avatar" style="background:var(--accent-dim);color:var(--accent);">${ini}</div>
            <div style="width:140px;"><div style="font-size:13px;font-weight:500;">${m.name}</div><div style="font-size:11px;color:var(--text-muted)">${m.role}</div></div>
            <div style="flex:1;"><div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span style="font-size:11px;color:var(--text-muted)">KPI</span><span style="font-size:11px;font-weight:700;color:${kpiColor}">${m.kpi}%</span></div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:${m.kpi}%;background:${kpiColor}"></div></div></div>
            <div style="text-align:right;width:50px;"><div style="font-size:15px;font-weight:700;">${m.tasks}</div><div style="font-size:10px;color:var(--text-muted)">задач</div></div>
          </div>`;
        }).join('')}
      </div>`;
  }

  function buildSettings() {
    return `<div style="max-width:600px;">
      <div class="card" style="margin-bottom:14px;">
        <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px;">Основное</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;">
          <div class="input-group"><label>Название проекта</label><div class="input-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg><input type="text" value="${proj.name}" /></div></div>
          <div class="input-group"><label>Статус</label><div class="input-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><input type="text" value="Активен" /></div></div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="alert('Сохранено!')">Сохранить</button>
      </div>
      <div class="card" style="margin-bottom:14px;">
        <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px;">Участники (${proj.team.length})</div>
        ${proj.team.map(m=>`
          <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);">
            <div class="avatar" style="background:var(--accent-dim);color:var(--accent);">${m.name.split(' ').map(w=>w[0]).join('').slice(0,2)}</div>
            <div style="flex:1;"><div style="font-size:13px;font-weight:500;">${m.name}</div><div style="font-size:11px;color:var(--text-muted)">${m.role}</div></div>
            <button class="btn btn-ghost btn-sm" style="padding:5px 8px;" onclick="alert('Удалить из проекта?')">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
            </button>
          </div>`).join('')}
        <button class="btn btn-ghost btn-sm" style="margin-top:10px;" onclick="alert('Добавить участника')">+ Добавить участника</button>
      </div>
    </div>`;
  }

  // ── PRODUCTS & SALES ────────────────────────────────────────
  let activeProdTab = 'cert';

  function buildProducts() {
    return `
      <style>
        .prod-tabs { display:flex;gap:2px;background:var(--bg-card2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px;width:fit-content;margin-bottom:20px; }
        .prod-tab  { padding:7px 18px;border-radius:5px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;color:var(--text-muted);border:none;background:transparent;font-family:inherit; }
        .prod-tab.active { background:var(--bg-primary);color:var(--text-primary);box-shadow:0 1px 4px rgba(0,0,0,.3); }
        .cert-grid { display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px; }
        .cert-field { background:var(--bg-card2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px; }
        .cert-field-label { font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px; }
        .cert-field-value { font-size:13px;font-weight:500;color:var(--text-primary); }
        .cert-field-value.mono { font-family:monospace;font-size:11px;word-break:break-all;color:var(--text-sub); }
        .device-row { display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04); }
        .device-row:last-child { border-bottom:none; }
        .pwd-wrap { display:flex;align-items:center;gap:8px; }
        .pwd-masked { font-size:16px;letter-spacing:2px;color:var(--text-sub); }
        .copy-btn { font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-dim);border:none;border-radius:var(--radius-sm);padding:3px 8px;cursor:pointer;font-family:inherit; }
        .copy-btn:hover { opacity:.8; }
      </style>

      <div class="prod-tabs">
        <button class="prod-tab ${activeProdTab==='cert'?'active':''}" onclick="switchProdTab('cert',this)">
          🔐 Apple Certificate
        </button>
        <button class="prod-tab ${activeProdTab==='account'?'active':''}" onclick="switchProdTab('account',this)">
          🍎 Apple Shared Account
        </button>
      </div>

      <div id="prod-content"></div>`;
  }

  function switchProdTab(tab, btn) {
    activeProdTab = tab;
    document.querySelectorAll('.prod-tab').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    renderProdContent();
  }

  function renderProdContent() {
    const el = document.getElementById('prod-content');
    if (!el) return;
    if (activeProdTab === 'cert') {
      el.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
          <div>
            <div style="font-size:16px;font-weight:700;margin-bottom:3px;">Apple Distribution Certificate</div>
            <div style="font-size:12px;color:var(--text-muted);">Сертификат для публикации приложений в App Store</div>
          </div>
          <span class="badge badge-green">● Активен</span>
        </div>

        <div class="cert-grid">
          <div class="cert-field">
            <div class="cert-field-label">Владелец</div>
            <div class="cert-field-value">BAZZAR LLC</div>
          </div>
          <div class="cert-field">
            <div class="cert-field-label">Тип</div>
            <div class="cert-field-value">Apple Distribution</div>
          </div>
          <div class="cert-field">
            <div class="cert-field-label">Дата выдачи</div>
            <div class="cert-field-value">01 декабря 2024</div>
          </div>
          <div class="cert-field">
            <div class="cert-field-label">Истекает</div>
            <div class="cert-field-value" style="color:var(--yellow);">01 декабря 2025</div>
          </div>
          <div class="cert-field" style="grid-column:span 2;">
            <div class="cert-field-label">SHA-1 Fingerprint</div>
            <div class="cert-field-value mono">A3:B9:4F:2D:8E:1C:77:30:F5:A2:6B:D4:93:0E:52:1F:C8:7A:B3:E6</div>
          </div>
          <div class="cert-field" style="grid-column:span 2;">
            <div class="cert-field-label">Team ID</div>
            <div class="cert-field-value mono" style="display:flex;align-items:center;gap:10px;">
              BZR4F9X2QK
              <button class="copy-btn" onclick="navigator.clipboard.writeText('BZR4F9X2QK');this.textContent='Скопировано ✓';setTimeout(()=>this.textContent='Копировать',1500)">Копировать</button>
            </div>
          </div>
        </div>

        <div style="display:flex;gap:8px;margin-top:4px;">
          <button class="btn btn-primary btn-sm" onclick="alert('Скачать .cer файл')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Скачать .cer
          </button>
          <button class="btn btn-ghost btn-sm" onclick="alert('Обновить сертификат')">Обновить</button>
          <button class="btn btn-ghost btn-sm" style="color:var(--red);margin-left:auto;" onclick="if(confirm('Отозвать сертификат? Это действие необратимо.'))alert('Сертификат отозван')">Отозвать</button>
        </div>`;
    } else {
      el.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
          <div>
            <div style="font-size:16px;font-weight:700;margin-bottom:3px;">Apple Shared Account</div>
            <div style="font-size:12px;color:var(--text-muted);">Общий аккаунт команды для разработки</div>
          </div>
          <span class="badge badge-green">● Активен</span>
        </div>

        <div class="cert-grid" style="margin-bottom:18px;">
          <div class="cert-field">
            <div class="cert-field-label">Apple ID</div>
            <div class="cert-field-value" style="display:flex;align-items:center;gap:8px;">
              dev@bazzar.team
              <button class="copy-btn" onclick="navigator.clipboard.writeText('dev@bazzar.team');this.textContent='✓';setTimeout(()=>this.textContent='Копировать',1500)">Копировать</button>
            </div>
          </div>
          <div class="cert-field">
            <div class="cert-field-label">Тип аккаунта</div>
            <div class="cert-field-value">Organisation · App Store Connect</div>
          </div>
          <div class="cert-field">
            <div class="cert-field-label">Пароль</div>
            <div class="pwd-wrap">
              <span class="pwd-masked" id="pwdDisplay">••••••••••••</span>
              <button class="copy-btn" onclick="togglePwd()">Показать</button>
              <button class="copy-btn" onclick="navigator.clipboard.writeText('Bazzar2025!');this.textContent='✓';setTimeout(()=>this.textContent='Копировать',1500)">Копировать</button>
            </div>
          </div>
          <div class="cert-field">
            <div class="cert-field-label">Двухфакторная аутентификация</div>
            <div class="cert-field-value" style="color:var(--accent);">✓ Включена</div>
          </div>
          <div class="cert-field" style="grid-column:span 2;">
            <div class="cert-field-label">App-specific пароль (для CI/CD)</div>
            <div class="cert-field-value mono" style="display:flex;align-items:center;gap:10px;">
              xxxx-xxxx-xxxx-xxxx
              <button class="copy-btn" onclick="navigator.clipboard.writeText('aaaa-bbbb-cccc-dddd');this.textContent='✓';setTimeout(()=>this.textContent='Копировать',1500)">Копировать</button>
            </div>
          </div>
        </div>

        <div class="card" style="padding:16px;">
          <div style="font-size:12px;font-weight:600;margin-bottom:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;">Доверенные устройства</div>
          <div class="device-row">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            <div style="flex:1;"><div style="font-size:13px;font-weight:500;">iPhone 15 Pro · Артём К.</div><div style="font-size:11px;color:var(--text-muted);">Последняя активность: сегодня</div></div>
            <span class="badge badge-green">Доверенное</span>
          </div>
          <div class="device-row">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            <div style="flex:1;"><div style="font-size:13px;font-weight:500;">MacBook Pro 14" · CI/CD</div><div style="font-size:11px;color:var(--text-muted);">Последняя активность: вчера</div></div>
            <span class="badge badge-green">Доверенное</span>
          </div>
          <div class="device-row">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            <div style="flex:1;"><div style="font-size:13px;font-weight:500;">iPhone 14 · Алексей К.</div><div style="font-size:11px;color:var(--text-muted);">Последняя активность: 3 дня назад</div></div>
            <span class="badge badge-muted">Устройство</span>
          </div>
        </div>`;
    }
    // Initialize pwd toggle after render
    window.pwdVisible = false;
    window.togglePwd = function() {
      pwdVisible = !pwdVisible;
      const el = document.getElementById('pwdDisplay');
      const btn = el?.nextElementSibling;
      if (el) el.textContent = pwdVisible ? 'Bazzar2025!' : '••••••••••••';
      if (btn) btn.textContent = pwdVisible ? 'Скрыть' : 'Показать';
    };
  }

  const builders = {products:buildProducts,chats:buildChats,tasks:buildTasks,finance:buildFinance,team:buildTeam,analytics:buildAnalytics,settings:buildSettings};
  const secTitles = {products:'Товары и продажи',chats:'Чаты',tasks:'Задания',finance:'Финансы',team:'Команда',analytics:'Аналитика',settings:'Настройки проекта'};

  function switchSection(id) {
    activeSection = id;
    document.querySelectorAll('.pnav-item').forEach(n=>n.classList.remove('active'));
    const navEl = document.getElementById('pnav-'+id);
    if (navEl) navEl.classList.add('active');
    document.getElementById('sectionTitle').textContent = `${proj.name} — ${secTitles[id]}`;
    document.getElementById('projContent').innerHTML = builders[id]?.() || '';
    if (id === 'products') renderProdContent();
    if (id === 'chats') {
      const cb = document.getElementById('projChatBody');
      if (cb) cb.scrollTop = cb.scrollHeight;
    }
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function projSend() {
    const input = document.getElementById('projChatInput');
    const text  = input.value.trim();
    if (!text) return;
    const now  = new Date();
    const time = `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
    const body = document.getElementById('projChatBody');
    const div  = document.createElement('div');
    div.className = 'bubble own';
    div.innerHTML = `<div class="bubble-body">${escHtml(text)}</div><div class="bubble-meta">${time}</div>`;
    body.appendChild(div);
    input.value = '';
    body.scrollTop = body.scrollHeight;
  }

  switchSection(activeSection);
</script>
<script src="notifications.js"></script>
<script>initNotifications();</script>
</body>
</html>
